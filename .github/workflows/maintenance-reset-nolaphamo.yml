name: Maintenance reset Nolaphamo password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET_NOLAPHAMO to confirm the production D1 password reset'
        required: true
        type: string

jobs:
  reset-password:
    if: ${{ inputs.confirm == 'RESET_NOLAPHAMO' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c63d3d6d8c17db7487ab40b81d5e29d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify target before reset
        working-directory: worker
        run: |
          npx wrangler d1 execute lehakwe-db --remote --command "SELECT staff_id, full_name, email, job_title, active, centre_id, CASE WHEN password_hash IS NULL THEN 0 ELSE 1 END AS has_password FROM staff WHERE lower(email) IN ('nolaphamorarabee@gmail.com','nolaphamorakabee@gmail.com');" --yes
      - name: Reset target password hash
        working-directory: worker
        run: |
          npx wrangler d1 execute lehakwe-db --remote --command "UPDATE staff SET password_hash = 'EBnsARzfC6K7SZV_UJ4A0Q:Oy0SEZVbL5kTRkkLdUtx-pC1lNbthzDaBQwwbBFBTgQ:100000', updated_at = datetime('now') WHERE active = 1 AND (lower(email) = 'nolaphamorarabee@gmail.com' OR (lower(email) = 'nolaphamorakabee@gmail.com' AND full_name LIKE 'Nolaphamo%')); SELECT changes() AS rows_updated;" --yes
      - name: Verify target after reset
        working-directory: worker
        run: |
          npx wrangler d1 execute lehakwe-db --remote --command "SELECT staff_id, full_name, email, job_title, active, centre_id, CASE WHEN password_hash = 'EBnsARzfC6K7SZV_UJ4A0Q:Oy0SEZVbL5kTRkkLdUtx-pC1lNbthzDaBQwwbBFBTgQ:100000' THEN 1 ELSE 0 END AS password_hash_matches FROM staff WHERE lower(email) IN ('nolaphamorarabee@gmail.com','nolaphamorakabee@gmail.com');" --yes
