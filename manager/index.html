<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name='theme-color' content='#0B5FB3' />
  <meta name='apple-mobile-web-app-capable' content='yes' />
  <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
  <meta name='apple-mobile-web-app-title' content='Lehakwe' />
  <meta name='description' content='ECD Operating System for South African Daycares' />
  <title>Lehakwe Daycare Manager</title>
  <link rel='manifest' href='/manifest.json' />
  <link rel='apple-touch-icon' href='/icons/icon-192.svg' />
  <link rel='icon' type='image/svg+xml' href='/icons/icon-512.svg' />
  <style>
    :root {
      --color-primary: #0B5FB3;
      --color-primary-dark: #073B73;
      --color-accent-teal: #16AFA3;
      --color-accent-yellow: #FDBA24;
      --color-accent-coral: #F87171;
      --color-bg-soft: #F8FBFF;
      --color-text: #111827;
      --color-muted: #6B7280;
      --color-white: #FFFFFF;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(11, 95, 179, 0.08), 0 1px 2px rgba(11, 95, 179, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--color-bg-soft);
      color: var(--color-text);
      line-height: 1.5;
    }
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--color-white); border-right: 1px solid #E5E7EB;
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    .sidebar-header {
      padding: 20px; border-bottom: 1px solid #E5E7EB;
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-header h1 { font-size: 1rem; font-weight: 700; color: var(--color-primary-dark); }
    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; text-decoration: none; color: var(--color-muted);
      font-size: 0.9rem; font-weight: 500; transition: all 0.15s;
    }
    .nav-item:hover { background: #F1F5F9; color: var(--color-primary-dark); }
    .nav-item.active { background: #FEF3C7; color: #D97706; font-weight: 600; }
    .sidebar-footer {
      padding: 16px; border-top: 1px solid #E5E7EB;
      font-size: 0.75rem; color: var(--color-muted); text-align: center;
    }
    .main-content { flex: 1; padding: 24px; overflow-y: auto; }
    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: var(--color-text); }
    .page-header p { color: var(--color-muted); font-size: 0.9rem; }
    .card {
      background: var(--color-white); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600;
      font-size: 0.875rem; cursor: pointer; transition: all 0.15s; text-decoration: none;
    }
    .btn-primary { background: var(--color-primary); color: var(--color-white); }
    .btn-primary:hover { background: var(--color-primary-dark); }
    .btn-secondary { background: #F1F5F9; color: var(--color-text); }
    .btn-secondary:hover { background: #E2E8F0; }
    .btn-success { background: var(--color-accent-teal); color: var(--color-white); }
    .btn-warning { background: var(--color-accent-yellow); color: var(--color-text); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .sidebar-nav { flex-direction: row; overflow-x: auto; padding: 12px; }
      .nav-item { white-space: nowrap; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
